<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>下雨了 · 3页插画样图</title><style>body{margin:0;background:#e8e7db;color:#344c3b;font:15px/1.85 sans-serif}main{max-width:740px;margin:auto;padding:20px 12px 40px}a{color:#365d43}h1{font:30px/1.5 KaiTi,STKaiti,serif;margin:14px 0}figure{position:relative;margin:24px 0;background:#fbf5e9;box-shadow:0 3px 18px #0002}img{display:block;width:100%;height:auto}figcaption{position:absolute;bottom:3.5%;left:8%;right:8%;text-align:center;font:clamp(21px,4vw,34px)/1.7 KaiTi,STKaiti,serif}figcaption p{margin:0}.note{background:#f8f5e9;padding:12px 16px;border-radius:10px;color:#62735a;font-size:13px}.label{color:#708163;font-size:12px}.label:before{content:'· '}</style></head><body><main><a href="../../">‹ 返回手机文稿</a><h1>《下雨了》<br>3页插画样图</h1><p>先看雨落下，再看孩子自己撑伞，最后走近小花，一起留在伞下。人物、伞和花园分层制作，两张人物画面复用同一个完整人物。</p><p class="note">当前使用项目默认人物确认画风，尚未放入任何孩子的真人照片。原生图片1058×1487像素；按A5铺满约179ppi，这是画风与合成校样，尚不是300ppi印刷成品。</p><p class="label">故事正文第2页</p><figure><img src="page-02-weather.png" width="1058" height="1487" alt="黑云来了，下雨了。" loading="eager" decoding="async"><figcaption><p>黑云来了，</p><p>下雨了。</p></figcaption></figure><p class="label">故事正文第3页</p><figure><img src="page-03-umbrella.png" width="1058" height="1487" alt="小伞开了。我在伞下。" loading="lazy" decoding="async"><figcaption><p>小伞开了。</p><p>我在伞下。</p></figcaption></figure><p class="label">故事正文第7页</p><figure><img src="page-07-share.png" width="1058" height="1487" alt="我和小花，都在伞下。" loading="lazy" decoding="async"><figcaption><p>我和小花，</p><p>都在伞下。</p></figcaption></figure><p>正式真人版继续保留原照片的五官和完整发型；本轮样图未替换线上成品绘本。</p><a href="../../">返回30篇手机文稿 ↑</a></main></body></html>
