<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雪人住我家 · 第三级第6本</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9eeeb;color:#304f50;font-family:'Microsoft YaHei',sans-serif}header{max-width:1000px;margin:0 auto;padding:36px 24px 20px}header small{letter-spacing:.16em}h1{margin:10px 0;font-family:serif;font-size:36px}header p{font-size:14px;line-height:1.8;color:#607476}.toolbar{position:sticky;top:0;z-index:2;background:#e9eeebf5;border-block:1px solid #ccd8d3;padding:12px 20px;display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap}button,select{font:inherit;background:#fffdf7;border:1px solid #b7c9c3;color:#304f50;border-radius:24px;padding:10px 18px;cursor:pointer}button:disabled{opacity:.4;cursor:default}main{max-width:1120px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0}canvas{display:block;width:100%;height:auto;background:#fffdf5;box-shadow:0 6px 28px #24404418}figcaption{font-size:13px;line-height:1.7;margin:12px 4px;color:#637b7a}.single{display:block;max-width:620px}.single figure{display:none}.single figure.active{display:block}footer{text-align:center;padding:30px;font-size:12px;color:#6c8582}@media(max-width:650px){main{grid-template-columns:1fr;max-width:560px}header{padding:22px}h1{font-size:30px}.toolbar{gap:8px}button,select{font-size:13px;padding:9px 13px}}@media print{body{background:white}header,.toolbar,figcaption,footer{display:none}main,main.single{display:block;margin:0;padding:0;max-width:none}figure,main.single figure{display:block!important;break-after:page}canvas{width:148mm;height:210mm;box-shadow:none}@page{size:148mm 210mm;margin:0}}
</style>
<header><small>小小主角 / 第三级 · 第6本</small><h1>雪人住我家</h1><p>一个留在雪地上，一个留在白纸上。<br>独立插画校样 · 封面、8页正文、识字小结</p></header>
<nav class="toolbar"><button id="layout">逐页阅读</button><button id="prev">上一页</button><select id="jump" aria-label="选择页码"></select><button id="next">下一页</button><button id="save" hidden>保存本机校样图片</button><span id="status" role="status">正在准备插画…</span></nav><main id="book"></main><footer>正文沿用完整复审v4 · 辅助字由成人带读 · 接触量不等于掌握量</footer>
<script>
const manuscript=/* MANIFEST */,sources=/* IMAGES */,poses=/* POSES */,headMetrics=/* HEADMETRICS */;
const rig=(()=>{const module={exports:{}};/* CHARACTER_RIG */;return module.exports})();
const main=document.querySelector('main'),status=document.querySelector('#status'),jump=document.querySelector('#jump');let current=0,single=false;
const images={},actors={},proof={pages:[],errors:[],textExact:false};window.book6Proof=proof;
function image(src){return new Promise((resolve,reject)=>{const i=new Image;i.onload=()=>resolve(i);i.onerror=()=>reject(Error('插画读取失败'));i.src=src})}
function lines(c,text,max){const out=[];for(const paragraph of text.split('\n')){let line='';for(const ch of paragraph){if(c.measureText(line+ch).width>max&&line){out.push(line);line=ch}else line+=ch}if(line)out.push(line)}return out}
function paper(c,x,y,w,stage=2,angle=0){c.save();c.translate(x,y);c.rotate(angle);const h=w*1.2;c.shadowColor='#334c5333';c.shadowBlur=6;c.shadowOffsetY=5;c.fillStyle='#fffef6';c.fillRect(-w/2,-h/2,w,h);c.shadowColor='transparent';c.strokeStyle='#e4ded0';c.lineWidth=1;c.strokeRect(-w/2,-h/2,w,h);c.scale(w/300,w/300);if(stage){c.strokeStyle='#7293a2';c.lineWidth=4;c.lineCap='round';c.beginPath();c.ellipse(0,52,81,82,.02,0,Math.PI*2);c.stroke();c.beginPath();c.ellipse(0,-77,49,49,-.02,0,Math.PI*2);c.stroke();if(stage===2){c.fillStyle='#344550';for(const [a,b,r]of [[-18,-82,5],[18,-82,5],[0,33,4],[0,58,4],[0,83,4]]){c.beginPath();c.arc(a,b,r,0,7);c.fill()}c.fillStyle='#d99b32';c.beginPath();c.moveTo(-52,-33);c.quadraticCurveTo(0,-20,52,-34);c.lineTo(48,-14);c.quadraticCurveTo(0,-3,-50,-14);c.closePath();c.fill();c.fillRect(30,-18,16,49);c.fillStyle='#db8843';c.beginPath();c.moveTo(0,-71);c.lineTo(25,-67);c.lineTo(0,-63);c.fill()}}c.restore()}
function pose(c,id,x,ground,scale){const p=poses[id],y=ground-(p.bounds.bottom-p.collar.y)/rig.CHILD_MODEL.sourcePixelsPerUnit*scale;composer.place(c,actors[id],{x,y,scale});return{x,y,scale,id}}
let composer;
function art(c,n){const key=manuscript.pages[n].background;c.drawImage(images[key],0,0,1000,1000);let actor=null;
 if(n===2){paper(c,505,850,220,0,-.04);actor=pose(c,'sit-draw',325,940,.82)}
 if(n===3||n===4)paper(c,485,525,590,n===3?1:2,-.065);
 if(n===5){actor=pose(c,'crouch-book',300,950,.79);paper(c,735,570,174,2,.03)}
 if(n===6){actor=pose(c,'stand-wave',600,960,.59);paper(c,790,640,156,2,.04)}
 if(n===7)paper(c,788,398,80,2,.01);
 return {background:key,actor,paperStage:n===2?0:n===3?1:n>=4?2:null};}
function decorate(c){c.fillStyle='#fffdf5';c.fillRect(0,0,1184,1680);c.strokeStyle='#dce6de';c.lineWidth=2;c.strokeRect(30,30,1124,1620)}
function drawPage(index){const cv=document.createElement('canvas');cv.width=1184;cv.height=1680;const c=cv.getContext('2d');decorate(c);c.fillStyle='#6e8885';c.font='24px Microsoft YaHei';c.fillText('第三级 · 第6本',64,57);let state;
 if(index===0){c.fillStyle='#345b5a';c.textAlign='center';c.font='bold 76px Microsoft YaHei';c.fillText(manuscript.title,592,197);c.font='28px Microsoft YaHei';c.fillStyle='#8c977b';c.fillText('小 小 主 角',592,267);c.save();c.translate(64,330);c.scale(1.056,1.056);state=art(c,6);c.restore();c.font='30px Microsoft YaHei';c.fillStyle='#536f6f';c.fillText('纸雪人住家里，小雪人住雪地上。',592,1500)}
 else if(index===9){c.textAlign='center';c.fillStyle='#345b5a';c.font='bold 64px Microsoft YaHei';c.fillText('读完啦',592,190);c.save();c.translate(337,260);c.scale(.51,.51);art(c,7);c.restore();c.font='38px Microsoft YaHei';c.fillText('本篇正文100字，出现55种汉字',592,875);c.font='32px Microsoft YaHei';c.fillText('辅助字：怕　成　圆',592,950);c.fillStyle='#71847b';c.font='27px Microsoft YaHei';c.fillText('这些字可以请大人带着读。',592,1010);c.textAlign='left';c.fillStyle='#416565';c.font='32px Microsoft YaHei';let yy=1120;for(const line of lines(c,'本书字表\n'+manuscript.statistics.characters.join('　'),1000)){c.fillText(line,92,yy);yy+=58}c.fillStyle='#8b9a8d';c.font='25px Microsoft YaHei';c.fillText('接触量不等于已经掌握的字数。',92,1540)}
 else{c.save();c.translate(64,90);c.scale(1.056,1.056);state=art(c,index-1);c.restore();c.font='46px Microsoft YaHei';c.fillStyle='#304b50';const bodyLines=lines(c,manuscript.pages[index-1].text,1030),start=1235;for(let i=0;i<bodyLines.length;i++)c.fillText(bodyLines[i],76,start+i*74);proof.pages.push({number:index,text:manuscript.pages[index-1].text,lines:bodyLines.length,lastBaseline:start+(bodyLines.length-1)*74,...state});}
 c.textAlign='center';c.font='24px Microsoft YaHei';c.fillStyle='#82938a';c.fillText(index===0?'雪人住我家':index===9?'识字小结':String(index).padStart(2,'0'),592,1620);return cv;}
function update(){[...main.children].forEach((f,i)=>f.classList.toggle('active',i===current));jump.value=current;document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===9}
jump.onchange=()=>{current=Number(jump.value);update()};document.querySelector('#prev').onclick=()=>{current=Math.max(0,current-1);update()};document.querySelector('#next').onclick=()=>{current=Math.min(9,current+1);update()};document.querySelector('#layout').onclick=()=>{single=!single;main.classList.toggle('single',single);document.querySelector('#layout').textContent=single?'展开全书':'逐页阅读';update()};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.querySelector('#next').click();if(e.key==='ArrowLeft')document.querySelector('#prev').click()});
(async()=>{try{for(const [key,src]of Object.entries(sources))images[key]=await image(src);composer=rig.createComposer(()=>document.createElement('canvas'),['sit-draw','stand-wave','crouch-book'].map(k=>poses[k]),{pixelDensity:2});const portrait=composer.prepare({kind:'illustrated',image:images.head,metrics:headMetrics});for(const id of ['sit-draw','stand-wave','crouch-book'])actors[id]=composer.compose({portrait,body:images[id],poseId:id});for(let i=0;i<10;i++){const f=document.createElement('figure'),canvas=drawPage(i),cap=document.createElement('figcaption');f.append(canvas,cap);cap.textContent=i===0?'封面':i===9?'识字小结':`第${i}页 · ${manuscript.pages[i-1].storyboard}`;main.append(f);jump.add(new Option(i===0?'封面':i===9?'识字小结':`第${i}页`,i))}proof.textExact=proof.pages.map(p=>p.text).join('\n')===manuscript.text;proof.actorCount=Object.keys(actors).length;proof.ready=true;status.textContent='10页已准备好';update();if(location.protocol==='http:'){document.querySelector('#save').hidden=false;document.querySelector('#save').onclick=save}}catch(e){proof.errors.push(e.message);status.textContent=e.message}})();
async function save(){status.textContent='正在保存图片…';try{let i=0;const thumbs=document.createElement('canvas');thumbs.width=1184;thumbs.height=672;const tc=thumbs.getContext('2d');tc.fillStyle='#e9eeeb';tc.fillRect(0,0,thumbs.width,thumbs.height);for(const canvas of main.querySelectorAll('canvas')){const response=await fetch('/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:`page-${String(i).padStart(2,'0')}.png`,data:canvas.toDataURL('image/png')})});if(!response.ok)throw Error('保存失败');tc.drawImage(canvas,(i%5)*236.8,Math.floor(i/5)*336,236.8,336);i++}thumbs.height;await fetch('/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'contact-sheet.png',data:thumbs.toDataURL('image/png')})});await fetch('/proof',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(proof)});status.textContent='已保存10页图片与检查记录'}catch(e){status.textContent=e.message}}
</script></html>
